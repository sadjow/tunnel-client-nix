name: Build and Cache

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}

  cache-matrix:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CACHIX_CACHE != ''
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: platforms
        run: |
          echo "matrix=$(jq -c '{include: [to_entries[] | {system: .key, runner: .value.runner}]}' platforms.json)" >> "$GITHUB_OUTPUT"

  cache:
    needs: cache-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cache-matrix.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Publish tested packages
        env:
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN"
          nix flake check --print-build-logs
          jq -r 'keys[]' variants.json | while read -r variant; do
            nix build ".#$variant" --no-link --print-out-paths | cachix push "$CACHIX_CACHE"
          done

  tags:
    needs: [validate, cache]
    if: >-
      always() && needs.validate.result == 'success' &&
      (needs.cache.result == 'success' || vars.CACHIX_CACHE == '') &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish version tags for the tested commit
        env:
          TESTED_SHA: ${{ github.sha }}
        run: bash scripts/tag-release.sh "$TESTED_SHA"
